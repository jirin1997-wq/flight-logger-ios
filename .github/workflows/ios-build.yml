name: iOS build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run the static checks
        run: |
          python3 tools/check-swift-calls.py
          python3 tools/check-translations.py
          python3 tools/detector-reference.py > /dev/null
          python3 tools/tile-reference.py > /dev/null

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project FlightLogger.xcodeproj \
            -scheme FlightLogger \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tail -200

      - name: Run the unit tests
        run: |
          set -o pipefail
          # The runner image changes its simulators; take the first iPhone it has.
          DEVICE=$(xcrun simctl list devices available | sed -n -E 's/^ *(iPhone[^(]*[^ (]) \(.*/\1/p' | head -1)
          echo "Testing on: $DEVICE"
          xcodebuild test \
            -project FlightLogger.xcodeproj \
            -scheme FlightLogger \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -300
